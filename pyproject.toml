[project]
name = "nbfc-ews"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic>=2.7,<3",
    "python-dotenv",
    "pyyaml",
    "tiktoken",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
pdf = ["docling"]
ui = ["streamlit>=1.40", "httpx"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy",
    "pre-commit>=3.7",
    "types-PyYAML",
    "httpx",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: needs a live Postgres"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]