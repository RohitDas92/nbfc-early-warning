<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1020" viewBox="0 0 1080 1020" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1080" height="1020" fill="#ffffff"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#111827">Full project &#8212; how every module connects</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">An arrow means &#8220;imports from&#8221;. Arrows only ever point downward. Anything that points back up is a design error.</text>

  <!-- ============ UI ============ -->
  <rect x="330" y="100" width="260" height="56" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="1.8"/>
  <text x="460" y="124" font-size="14.5" font-weight="700" fill="#831843" text-anchor="middle">ui/  &#183;  Streamlit</text>
  <text x="460" y="143" font-size="11.5" fill="#9d174d" text-anchor="middle">dashboard, case queue, chat</text>

  <line x1="460" y1="156" x2="460" y2="196" stroke="#db2777" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#pink)"/>
  <text x="472" y="180" font-size="11.5" font-weight="600" fill="#be185d">HTTP only &#8212; imports nothing</text>

  <!-- ============ API ============ -->
  <rect x="330" y="200" width="260" height="56" rx="8" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.8"/>
  <text x="460" y="224" font-size="14.5" font-weight="700" fill="#881337" text-anchor="middle">api/  &#183;  FastAPI</text>
  <text x="460" y="243" font-size="11.5" fill="#9f1239" text-anchor="middle">routers &#183; auth &#183; deps.py</text>

  <line x1="460" y1="256" x2="460" y2="296" stroke="#e11d48" stroke-width="2" marker-end="url(#rose)"/>

  <!-- ============ SERVICES ============ -->
  <rect x="330" y="300" width="260" height="56" rx="8" fill="#ffedd5" stroke="#ea580c" stroke-width="1.8"/>
  <text x="460" y="324" font-size="14.5" font-weight="700" fill="#7c2d12" text-anchor="middle">services/</text>
  <text x="460" y="343" font-size="11.5" fill="#9a3412" text-anchor="middle">case &#183; portfolio &#183; chat</text>

  <!-- services fan-out -->
  <path d="M 400 356 L 400 386 Q 400 396 388 396 L 212 396 Q 200 396 200 406 L 200 424" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#orange)"/>
  <path d="M 520 356 L 520 386 Q 520 396 532 396 L 708 396 Q 720 396 720 406 L 720 424" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#orange)"/>

  <!-- ============ ENGINE / AGENTS ============ -->
  <rect x="70" y="428" width="260" height="72" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="200" y="452" font-size="14.5" font-weight="700" fill="#4c1d95" text-anchor="middle">engine/   the deterministic pipeline</text>
  <text x="200" y="471" font-size="11.5" fill="#5b21b6" text-anchor="middle">classify &#183; detect &#183; route &#183; nightly</text>
  <text x="200" y="489" font-size="11" font-weight="700" fill="#b91c1c" text-anchor="middle">must NOT import llm, agents or tools</text>

  <rect x="590" y="428" width="260" height="72" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/>
  <text x="720" y="452" font-size="14.5" font-weight="700" fill="#312e81" text-anchor="middle">agents/   LangGraph</text>
  <text x="720" y="471" font-size="11.5" fill="#3730a3" text-anchor="middle">supervisor &#183; investigators &#183; arbitrate</text>
  <text x="720" y="489" font-size="11" fill="#4338ca" text-anchor="middle">no SQL &#8212; agents only call tools</text>

  <!-- agents fan-out -->
  <path d="M 650 500 L 650 528 Q 650 538 638 538 L 432 538 Q 420 538 420 548 L 420 566" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#indigo)"/>
  <line x1="720" y1="500" x2="720" y2="566" stroke="#4f46e5" stroke-width="2" marker-end="url(#indigo)"/>
  <path d="M 790 500 L 790 528 Q 790 538 802 538 L 908 538 Q 920 538 920 548 L 920 566" stroke="#4f46e5" stroke-width="2" fill="none" marker-end="url(#indigo)"/>

  <!-- ============ TOOLS / LLM / GUARD ============ -->
  <rect x="310" y="570" width="220" height="66" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.8"/>
  <text x="420" y="594" font-size="14" font-weight="700" fill="#134e4a" text-anchor="middle">tools/</text>
  <text x="420" y="612" font-size="11.5" fill="#115e59" text-anchor="middle">payment &#183; bureau &#183; cohort</text>
  <text x="420" y="628" font-size="11" fill="#0f766e" text-anchor="middle">read-only by construction</text>

  <rect x="610" y="570" width="220" height="66" rx="8" fill="#cffafe" stroke="#0891b2" stroke-width="1.8"/>
  <text x="720" y="594" font-size="14" font-weight="700" fill="#164e63" text-anchor="middle">llm/</text>
  <text x="720" y="612" font-size="11.5" fill="#155e75" text-anchor="middle">azure_openai &#183; local &#183; fake</text>
  <text x="720" y="628" font-size="11" fill="#0e7490" text-anchor="middle">one interface, swappable</text>

  <rect x="850" y="570" width="180" height="66" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
  <text x="940" y="594" font-size="14" font-weight="700" fill="#7f1d1d" text-anchor="middle">guard/</text>
  <text x="940" y="612" font-size="11.5" fill="#991b1b" text-anchor="middle">egress &#183; PII &#183; safety</text>
  <text x="940" y="628" font-size="11" fill="#b91c1c" text-anchor="middle">fails closed</text>

  <!-- tools fan-out -->
  <path d="M 370 636 L 370 664 Q 370 674 358 674 L 232 674 Q 220 674 220 684 L 220 700" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#teal)"/>
  <path d="M 470 636 L 470 664 Q 470 674 482 674 L 508 674 Q 520 674 520 684 L 520 700" stroke="#0d9488" stroke-width="2" fill="none" marker-end="url(#teal)"/>

  <!-- engine -> db -->
  <path d="M 200 500 L 200 700" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#violet)"/>

  <!-- ============ DB / RETRIEVAL ============ -->
  <rect x="110" y="704" width="220" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="220" y="728" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">db/</text>
  <text x="220" y="746" font-size="11.5" fill="#166534" text-anchor="middle">engine &#183; repositories &#183; migrations</text>
  <text x="220" y="762" font-size="11" fill="#15803d" text-anchor="middle">queries only &#8212; no business rules</text>

  <rect x="410" y="704" width="220" height="66" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
  <text x="520" y="728" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">retrieval/</text>
  <text x="520" y="746" font-size="11.5" fill="#166534" text-anchor="middle">pgvector &#183; azure_search</text>
  <text x="520" y="762" font-size="11" fill="#15803d" text-anchor="middle">policy search for citations</text>

  <line x1="220" y1="770" x2="220" y2="836" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>
  <line x1="520" y1="770" x2="520" y2="836" stroke="#16a34a" stroke-width="2" marker-end="url(#green)"/>

  <!-- ============ DOMAIN ============ -->
  <rect x="110" y="840" width="700" height="86" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text x="460" y="866" font-size="15.5" font-weight="700" fill="#1e3a8a" text-anchor="middle">domain/   &#8212; you are here</text>
  <text x="460" y="887" font-size="12" fill="#1e40af" text-anchor="middle">models &#183; classification &#183; case_state &#183; signals &#183; routing &#183; authority &#183; pii</text>
  <text x="460" y="908" font-size="11.5" font-style="italic" fill="#1d4ed8" text-anchor="middle">pure functions &#183; imports nothing of ours &#183; no database, no model, no clock, no randomness</text>

  <!-- ============ SIDE: EVAL + OBS ============ -->
  <rect x="850" y="704" width="180" height="66" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="940" y="728" font-size="14" font-weight="700" fill="#78350f" text-anchor="middle">eval/</text>
  <text x="940" y="746" font-size="11.5" fill="#92400e" text-anchor="middle">scoring &#183; harness</text>
  <text x="940" y="762" font-size="11" fill="#b45309" text-anchor="middle">never imported by src</text>

  <path d="M 890 770 L 890 800 Q 890 812 876 812 L 700 812 Q 686 812 686 824 L 686 836" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#amber)"/>

  <rect x="850" y="300" width="180" height="56" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.8"/>
  <text x="940" y="324" font-size="14" font-weight="700" fill="#374151" text-anchor="middle">obs/  &#183;  Langfuse</text>
  <text x="940" y="343" font-size="11.5" fill="#6b7280" text-anchor="middle">traces &#183; cost</text>

  <!-- ============ RULES ============ -->
  <text x="40" y="966" font-size="13" fill="#374151"><tspan font-weight="700">The two lines that carry the architecture:</tspan></text>
  <text x="40" y="988" font-size="12.5" fill="#374151">1. <tspan font-weight="700">engine/ must never import llm/, agents/ or tools/</tspan> &#8212; that is the determinism boundary written as code, enforced by a build-failing test.</text>
  <text x="40" y="1008" font-size="12.5" fill="#374151">2. <tspan font-weight="700">ui/ imports nothing from src</tspan> &#8212; a dashboard that cannot import your services cannot accidentally hold business logic.</text>

  <defs>
    <marker id="pink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#db2777"/></marker>
    <marker id="rose" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e11d48"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#ea580c"/></marker>
    <marker id="violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#7c3aed"/></marker>
    <marker id="indigo" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#4f46e5"/></marker>
    <marker id="teal" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#0d9488"/></marker>
    <marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#16a34a"/></marker>
    <marker id="amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
