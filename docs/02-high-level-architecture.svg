<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 960" width="940" height="960" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="940" height="960" fill="#FBFBFC"/>

  <text x="470" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#14161A">Early Warning &amp; Portfolio Surveillance — High-Level Architecture</text>
  <text x="470" y="49" text-anchor="middle" font-size="11" fill="#6A7079">Logical components and the boundaries between them. No technology choices.</text>

  <!-- ============ SOURCES ============ -->
  <text x="80" y="76" font-size="11" font-weight="700" fill="#4A6FA5" letter-spacing="0.6">SOURCES</text>
  <g fill="#E8EEF7" stroke="#4A6FA5" stroke-width="1.2">
    <rect x="80"  y="84" width="146" height="46" rx="6"/>
    <rect x="238" y="84" width="146" height="46" rx="6"/>
    <rect x="396" y="84" width="146" height="46" rx="6"/>
    <rect x="554" y="84" width="146" height="46" rx="6"/>
    <rect x="712" y="84" width="146" height="46" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="12" fill="#14161A" font-weight="600">
    <text x="153" y="105">LOS</text>
    <text x="311" y="105">LMS</text>
    <text x="469" y="105">Bureau</text>
    <text x="627" y="105">Policy Corpus</text>
    <text x="785" y="105">Identity Provider</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#6A7079">
    <text x="153" y="119">loan · borrower · course</text>
    <text x="311" y="119">presentations · DPD</text>
    <text x="469" y="119">snapshots · approved pulls</text>
    <text x="627" y="119">RBI · SOP · settlement</text>
    <text x="785" y="119">roles · scope claims</text>
  </g>
  <text x="470" y="146" text-anchor="middle" font-size="9.5" fill="#B57A3C" font-style="italic">release one: all transactional sources are the synthetic generator</text>

  <path d="M470 152 L470 176" stroke="#8A9099" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="480" y="168" font-size="9.5" fill="#6A7079">nightly ingest</text>

  <!-- ============ DATA FOUNDATION ============ -->
  <text x="80" y="196" font-size="11" font-weight="700" fill="#4A7A5C" letter-spacing="0.6">DATA FOUNDATION</text>
  <g fill="#E9F2EC" stroke="#4A7A5C" stroke-width="1.2">
    <rect x="80"  y="204" width="146" height="52" rx="6"/>
    <rect x="238" y="204" width="146" height="52" rx="6"/>
    <rect x="396" y="204" width="146" height="52" rx="6"/>
    <rect x="554" y="204" width="146" height="52" rx="6"/>
    <rect x="712" y="204" width="146" height="52" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#14161A" font-weight="600">
    <text x="153" y="226">Portfolio Store</text>
    <text x="311" y="226">Derived Store</text>
    <text x="469" y="226">Knowledge Store</text>
    <text x="627" y="226">Case Store</text>
    <text x="785" y="226">Audit Log</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#6A7079">
    <text x="153" y="240">book + 3–4 yrs</text>
    <text x="153" y="250">monthly history</text>
    <text x="311" y="240">buckets · roll rates</text>
    <text x="311" y="250">transition matrix</text>
    <text x="469" y="240">policy corpus,</text>
    <text x="469" y="250">chunked + indexed</text>
    <text x="627" y="240">evidence · recs</text>
    <text x="627" y="250">interventions · outcomes</text>
    <text x="785" y="240">append-only,</text>
    <text x="785" y="250">immutable</text>
  </g>

  <path d="M153 262 L153 292" stroke="#8A9099" stroke-width="1.4" marker-end="url(#ar)"/>
  <path d="M627 292 L627 264" stroke="#8A9099" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="637" y="282" font-size="9.5" fill="#6A7079">cases written</text>

  <!-- ============ DETERMINISTIC ============ -->
  <text x="80" y="312" font-size="11" font-weight="700" fill="#B57A3C" letter-spacing="0.6">DETERMINISTIC ENGINE — “the flow”</text>
  <g fill="#FDF0E3" stroke="#B57A3C" stroke-width="1.2">
    <rect x="80"  y="320" width="184" height="50" rx="6"/>
    <rect x="276" y="320" width="184" height="50" rx="6"/>
    <rect x="472" y="320" width="184" height="50" rx="6"/>
    <rect x="668" y="320" width="190" height="50" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#14161A" font-weight="600">
    <text x="172" y="341">Classification</text>
    <text x="368" y="341">Portfolio Metrics</text>
    <text x="564" y="341">Signal Engine</text>
    <text x="763" y="341">Suppression &amp; Router</text>
  </g>
  <g text-anchor="middle" font-size="9" fill="#6A7079">
    <text x="172" y="356">DPD · SMA · IRACP · provisioning</text>
    <text x="368" y="356">roll fwd / back · matrix</text>
    <text x="564" y="356">thresholds → ~240 signals/wk</text>
    <text x="763" y="356">open · join · escalate</text>
  </g>
  <path d="M264 345 L274 345" stroke="#B57A3C" stroke-width="1.4" marker-end="url(#ar2)"/>
  <path d="M460 345 L470 345" stroke="#B57A3C" stroke-width="1.4" marker-end="url(#ar2)"/>
  <path d="M656 345 L666 345" stroke="#B57A3C" stroke-width="1.4" marker-end="url(#ar2)"/>

  <!-- determinism boundary -->
  <line x1="60" y1="392" x2="880" y2="392" stroke="#A54A4A" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="330" y="382" width="280" height="19" rx="4" fill="#FBFBFC"/>
  <text x="470" y="396" text-anchor="middle" font-size="10" font-weight="700" fill="#A54A4A" letter-spacing="0.4">DETERMINISM BOUNDARY</text>

  <path d="M300 402 L300 428" stroke="#8A9099" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="310" y="420" font-size="9.5" fill="#6A7079">~60–80 prioritised cases/wk</text>

  <!-- ============ AGENTIC ============ -->
  <rect x="66" y="436" width="580" height="232" rx="10" fill="none" stroke="#6D4E9C" stroke-width="1.4" stroke-dasharray="4 4"/>
  <text x="80" y="452" font-size="11" font-weight="700" fill="#6D4E9C" letter-spacing="0.6">AGENTIC LAYER — “the exceptions”</text>

  <rect x="80" y="460" width="552" height="40" rx="6" fill="#F0E9F7" stroke="#6D4E9C" stroke-width="1.4"/>
  <text x="356" y="477" text-anchor="middle" font-size="12" font-weight="700" fill="#14161A">Triage Supervisor</text>
  <text x="356" y="491" text-anchor="middle" font-size="9" fill="#6A7079">prioritise · allocate · arbitrate conflicts · decide when there is enough · step budget</text>

  <g fill="#F6F2FB" stroke="#6D4E9C" stroke-width="1.1">
    <rect x="80"  y="512" width="105" height="56" rx="6"/>
    <rect x="192" y="512" width="105" height="56" rx="6"/>
    <rect x="304" y="512" width="105" height="56" rx="6"/>
    <rect x="416" y="512" width="105" height="56" rx="6"/>
    <rect x="528" y="512" width="104" height="56" rx="6"/>
  </g>
  <g text-anchor="middle" font-size="10" fill="#14161A" font-weight="600">
    <text x="132" y="534">Repayment</text><text x="132" y="546">Behaviour</text>
    <text x="244" y="534">External</text><text x="244" y="546">Behaviour</text>
    <text x="356" y="534">Borrower</text><text x="356" y="546">Context</text>
    <text x="468" y="540">Cohort</text>
    <text x="580" y="534">Action &amp;</text><text x="580" y="546">Policy</text>
  </g>
  <g text-anchor="middle" font-size="8" fill="#6A7079">
    <text x="132" y="560">own book</text>
    <text x="244" y="560">bureau</text>
    <text x="356" y="560">institution · course</text>
    <text x="468" y="560">across alerts</text>
    <text x="580" y="560">what's permitted</text>
  </g>

  <g fill="#F0E9F7" stroke="#6D4E9C" stroke-width="1.1">
    <rect x="80"  y="586" width="272" height="42" rx="6"/>
    <rect x="360" y="586" width="272" height="42" rx="6"/>
  </g>
  <text x="216" y="603" text-anchor="middle" font-size="11" font-weight="600" fill="#14161A">Narrative Composer</text>
  <text x="216" y="617" text-anchor="middle" font-size="8.5" fill="#6A7079">case note · recommendation · citations</text>
  <text x="496" y="603" text-anchor="middle" font-size="11" font-weight="600" fill="#14161A">Case Chat Agent</text>
  <text x="496" y="617" text-anchor="middle" font-size="8.5" fill="#6A7079">scoped to one case · writes auditable events</text>

  <text x="356" y="654" text-anchor="middle" font-size="9.5" fill="#6D4E9C" font-style="italic">eager overnight for top N by priority · lazy on open for the tail</text>

  <!-- interactive lane -->
  <text x="676" y="452" font-size="11" font-weight="700" fill="#5A5A78" letter-spacing="0.6">INTERACTIVE</text>
  <rect x="676" y="460" width="182" height="46" rx="6" fill="#EDEDF2" stroke="#5A5A78" stroke-width="1.2"/>
  <text x="767" y="479" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14161A">Analyst UI</text>
  <text x="767" y="493" text-anchor="middle" font-size="8.5" fill="#6A7079">thin client · renders, never decides</text>

  <path d="M767 508 L767 528" stroke="#8A9099" stroke-width="1.4" marker-end="url(#ar)"/>

  <rect x="676" y="530" width="182" height="60" rx="6" fill="#EDEDF2" stroke="#5A5A78" stroke-width="1.2"/>
  <text x="767" y="550" text-anchor="middle" font-size="11.5" font-weight="600" fill="#14161A">Application API</text>
  <text x="767" y="564" text-anchor="middle" font-size="8.5" fill="#6A7079">case · portfolio · chat · admin</text>
  <text x="767" y="577" text-anchor="middle" font-size="8.5" fill="#6A7079">deny by default</text>

  <path d="M674 560 L640 560" stroke="#8A9099" stroke-width="1.4" marker-end="url(#ar)"/>
  <text x="648" y="605" font-size="9" fill="#6A7079" text-anchor="middle">case actions</text>

  <!-- ============ TOOL LAYER ============ -->
  <path d="M356 668 L356 690" stroke="#8A9099" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="80" y="692" width="552" height="52" rx="6" fill="#EDEDF2" stroke="#5A5A78" stroke-width="1.3"/>
  <text x="356" y="712" text-anchor="middle" font-size="11.5" font-weight="700" fill="#14161A">TOOL LAYER — read-only by construction</text>
  <text x="356" y="727" text-anchor="middle" font-size="9" fill="#6A7079">portfolio &amp; derived reads · policy retrieval · intervention-history lookup · runs under the CALLER's identity</text>
  <text x="356" y="738" text-anchor="middle" font-size="8.5" fill="#A54A4A">no tool in this layer has external effect — enforced by what exists, not by prompt instructions</text>

  <path d="M80 718 L60 718 L60 240 L76 240" stroke="#4A7A5C" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#ar3)"/>
  <text x="24" y="480" font-size="9" fill="#4A7A5C" transform="rotate(-90 24 480)" text-anchor="middle">reads scoped by principal</text>

  <!-- authority boundary -->
  <line x1="60" y1="764" x2="880" y2="764" stroke="#A54A4A" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="335" y="754" width="270" height="19" rx="4" fill="#FBFBFC"/>
  <text x="470" y="768" text-anchor="middle" font-size="10" font-weight="700" fill="#A54A4A" letter-spacing="0.4">AUTHORITY BOUNDARY</text>
  <text x="470" y="786" text-anchor="middle" font-size="9.5" fill="#6A7079">agents propose · only a human with authority executes anything with external effect</text>

  <!-- ============ PII GATE ============ -->
  <rect x="196" y="798" width="440" height="46" rx="6" fill="#FBE9E9" stroke="#A54A4A" stroke-width="1.5"/>
  <text x="416" y="817" text-anchor="middle" font-size="12" font-weight="700" fill="#14161A">PII EGRESS GATE</text>
  <text x="416" y="832" text-anchor="middle" font-size="8.5" fill="#6A7079">tokenise entities · fails closed · the ONLY door out — model calls and trace export both pass here</text>

  <!-- trust boundary -->
  <line x1="60" y1="866" x2="880" y2="866" stroke="#A54A4A" stroke-width="1.6" stroke-dasharray="7 5"/>
  <rect x="360" y="856" width="220" height="19" rx="4" fill="#FBFBFC"/>
  <text x="470" y="870" text-anchor="middle" font-size="10" font-weight="700" fill="#A54A4A" letter-spacing="0.4">TRUST BOUNDARY</text>

  <rect x="196" y="886" width="200" height="42" rx="6" fill="#F4F4F6" stroke="#8A9099" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="296" y="903" text-anchor="middle" font-size="11" font-weight="600" fill="#14161A">Model Endpoint</text>
  <text x="296" y="917" text-anchor="middle" font-size="8.5" fill="#6A7079">sees structure, never identity</text>

  <rect x="436" y="886" width="200" height="42" rx="6" fill="#F4F4F6" stroke="#8A9099" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="536" y="903" text-anchor="middle" font-size="11" font-weight="600" fill="#14161A">Observability Store</text>
  <text x="536" y="917" text-anchor="middle" font-size="8.5" fill="#6A7079">traced at CASE granularity</text>

  <!-- right rail -->
  <rect x="872" y="204" width="30" height="640" rx="6" fill="#EFF1F4" stroke="#8A9099" stroke-width="1"/>
  <text x="887" y="524" font-size="10" font-weight="700" fill="#4A5058" transform="rotate(-90 887 524)" text-anchor="middle">IDENTITY &amp; ACCESS · principal on every call · row-level scope</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#8A9099"/></marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#B57A3C"/></marker>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#4A7A5C"/></marker>
  </defs>
</svg>
