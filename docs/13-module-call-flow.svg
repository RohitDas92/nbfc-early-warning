<svg xmlns="http://www.w3.org/2000/svg" width="960" height="880" viewBox="0 0 960 880" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="960" height="880" fill="#ffffff"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#111827">How the modules connect</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">An arrow means "imports from". Arrows only ever point downward — that is the rule.</text>

  <!-- ================= SECTION 1 ================= -->
  <text x="40" y="118" font-size="16" font-weight="700" fill="#111827">1 &#183; What you have built so far</text>

  <!-- tests row -->
  <rect x="60" y="140" width="230" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="175" y="165" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">tests/unit/</text>
  <text x="175" y="184" font-size="12" fill="#92400e" text-anchor="middle">test_classification.py</text>

  <rect x="330" y="140" width="230" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="445" y="165" font-size="13.5" font-weight="600" fill="#92400e" text-anchor="middle">tests/unit/</text>
  <text x="445" y="184" font-size="12" fill="#92400e" text-anchor="middle">test_case_state.py</text>

  <rect x="600" y="140" width="230" height="58" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="715" y="165" font-size="13.5" font-weight="600" fill="#6b7280" text-anchor="middle">tests/unit/</text>
  <text x="715" y="184" font-size="12" fill="#6b7280" text-anchor="middle">test_signals.py  (next)</text>

  <!-- domain row -->
  <rect x="60" y="268" width="230" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="175" y="294" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">classification.py</text>
  <text x="175" y="314" font-size="11.5" fill="#1e40af" text-anchor="middle">bucket_of(dpd)</text>
  <text x="175" y="331" font-size="11.5" fill="#1e40af" text-anchor="middle">asset_class_of(dpd)</text>

  <rect x="330" y="268" width="230" height="76" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="445" y="294" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">case_state.py</text>
  <text x="445" y="314" font-size="11.5" fill="#1e40af" text-anchor="middle">apply_event(case, event)</text>
  <text x="445" y="331" font-size="11.5" fill="#1e40af" text-anchor="middle">_TRANSITIONS</text>

  <rect x="600" y="268" width="230" height="76" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="715" y="294" font-size="14" font-weight="700" fill="#4b5563" text-anchor="middle">signals.py  (next)</text>
  <text x="715" y="314" font-size="11.5" fill="#6b7280" text-anchor="middle">AccountFacts</text>
  <text x="715" y="331" font-size="11.5" fill="#6b7280" text-anchor="middle">evaluate(facts)</text>

  <!-- models -->
  <rect x="270" y="420" width="350" height="86" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="445" y="447" font-size="15" font-weight="700" fill="#14532d" text-anchor="middle">models.py</text>
  <text x="445" y="468" font-size="11.5" fill="#166534" text-anchor="middle">Case &#183; Event</text>
  <text x="445" y="485" font-size="11.5" fill="#166534" text-anchor="middle">CaseState &#183; EventType &#183; CloseOutcome</text>
  <text x="445" y="500" font-size="11" font-style="italic" fill="#15803d" text-anchor="middle">imports nothing of ours &#8212; the foundation</text>

  <!-- arrows: tests -> domain -->
  <line x1="175" y1="198" x2="175" y2="262" stroke="#f59e0b" stroke-width="2" marker-end="url(#amber)"/>
  <line x1="445" y1="198" x2="445" y2="262" stroke="#f59e0b" stroke-width="2" marker-end="url(#amber)"/>
  <line x1="715" y1="198" x2="715" y2="262" stroke="#9ca3af" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#grey)"/>

  <!-- arrows: domain -> models -->
  <path d="M 445 344 L 445 414" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <path d="M 715 344 L 715 384 Q 715 396 700 396 L 560 396 Q 545 396 545 408 L 545 414" stroke="#9ca3af" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#grey)"/>

  <text x="470" y="385" font-size="11.5" fill="#1d4ed8">imports Case, Event, CaseState, EventType</text>

  <!-- classification note -->
  <text x="175" y="368" font-size="11.5" fill="#6b7280" text-anchor="middle">imports nothing of ours</text>
  <text x="175" y="385" font-size="11.5" fill="#6b7280" text-anchor="middle">(pure &#8212; only typing.Literal)</text>

  <!-- divider -->
  <line x1="40" y1="548" x2="920" y2="548" stroke="#e5e7eb" stroke-width="1.5"/>

  <!-- ================= SECTION 2 ================= -->
  <text x="40" y="588" font-size="16" font-weight="700" fill="#111827">2 &#183; Where these plug in later</text>
  <text x="40" y="610" font-size="13" fill="#6b7280">Nothing below exists yet. It shows who will call the code you are writing now.</text>

  <rect x="60" y="634" width="250" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="185" y="656" font-size="13.5" font-weight="700" fill="#4c1d95" text-anchor="middle">engine/detect.py</text>
  <text x="185" y="675" font-size="11.5" fill="#5b21b6" text-anchor="middle">runs the rules over the whole book</text>

  <rect x="355" y="634" width="250" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="480" y="656" font-size="13.5" font-weight="700" fill="#4c1d95" text-anchor="middle">engine/classify.py</text>
  <text x="480" y="675" font-size="11.5" fill="#5b21b6" text-anchor="middle">writes buckets &amp; asset classes</text>

  <rect x="650" y="634" width="250" height="54" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="775" y="656" font-size="13.5" font-weight="700" fill="#4c1d95" text-anchor="middle">services/case_service.py</text>
  <text x="775" y="675" font-size="11.5" fill="#5b21b6" text-anchor="middle">open / snooze / close a case</text>

  <rect x="270" y="762" width="420" height="62" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="480" y="788" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">domain/  &#8212; everything from section 1</text>
  <text x="480" y="809" font-size="11.5" fill="#1e40af" text-anchor="middle">pure functions &#183; no database &#183; no model &#183; no clock</text>

  <path d="M 185 688 L 185 730 Q 185 742 200 742 L 320 742 Q 335 742 335 754 L 335 756" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#violet)"/>
  <line x1="480" y1="688" x2="480" y2="756" stroke="#7c3aed" stroke-width="2" marker-end="url(#violet)"/>
  <path d="M 775 688 L 775 730 Q 775 742 760 742 L 640 742 Q 625 742 625 754 L 625 756" stroke="#7c3aed" stroke-width="2" fill="none" marker-end="url(#violet)"/>

  <text x="40" y="858" font-size="12.5" fill="#374151">The rule: arrows never point back up. <tspan font-weight="700">domain/</tspan> never imports engine, services, agents or the database &#8212; which is why it can be tested with no Docker, no Azure, no network.</text>

  <defs>
    <marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#2563eb"/>
    </marker>
    <marker id="amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#f59e0b"/>
    </marker>
    <marker id="grey" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#9ca3af"/>
    </marker>
    <marker id="violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
